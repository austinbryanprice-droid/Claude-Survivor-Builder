name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: Playwright 1.56 does not support Ubuntu 26.04, which `ubuntu-latest` now maps to.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The browser tests run against the production build, software-rendered, and the two projects are
  # independent (the multiplayer one only waits for the other locally, to have the machine to
  # itself). Side by side they take the time of the longer one, which kept the run well inside its
  # limit as the game grew; in one job they were at ten and a half of fifteen minutes. The Chromium
  # project then grew to thirteen and a half minutes on a good runner, and the same tests took one
  # and a half times as long on a slow one, so it ran as two halves. The intro film's tests added
  # six minutes more, and one half was cancelled at the limit on a slow runner (the other took
  # eighteen and a half of twenty without them), so it ran as three thirds. The title screen's six
  # tests moved the edges of the thirds, and the first was already at fifteen of twenty minutes on
  # a good runner, so it runs as four quarters. Playwright cuts them by test, in file order, so
  # what a shard takes follows what is in it; the film's tests and the play spec are the long ones.
  browser:
    name: browser (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/4, project: chromium, shard: 1/4 }
          - { name: chromium 2/4, project: chromium, shard: 2/4 }
          - { name: chromium 3/4, project: chromium, shard: 3/4 }
          - { name: chromium 4/4, project: chromium, shard: 4/4 }
          - { name: multiplayer, project: multiplayer, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only the browser: the runner image already has every library Chromium loads. `--with-deps` also
      # runs apt-get against the Ubuntu mirror, which on some runners crawls for six to seventeen minutes
      # (a few fonts and upgrades, at 50 kB/s) and uses up the job's limit; the browser itself downloads
      # in seconds.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Browser tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --no-deps
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
